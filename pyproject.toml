[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-libravdb"
version = "0.6.4"
description = "Native LibraVDB memory provider for Hermes Agent using real gRPC"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.60",
    "libravdb-contracts>=2.0.5",
]

[project.scripts]
hermes-memory-libravdb-setup = "hermes_memory_libravdb.install:main"

[project.entry-points."hermes_agent.plugins"]
libravdb = "hermes_memory_libravdb"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_memory_libravdb = ["plugin.yaml", "py.typed"]
